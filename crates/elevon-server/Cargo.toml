[package]
name = "elevon-server"
default-run = "elevon-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "elevon-server"
path = "src/main.rs"

[[bin]]
name = "toasty"
path = "src/bin/toasty.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[dependencies]
axum-client-ip = "1.3.1"
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
toasty = { version = "0.11.0", default-features = false, features = [
  "jiff",
  "turso",
] }
toasty-cli = "0.11.0"
toasty-driver-turso = "0.11.0"
tower-http = { version = "0.7.1", features = ["trace"] }
jiff = { version = "0.2.38", features = ["serde"] }
time = "0.3.55"
serde_json = "1.0.154"
headers = "0.4.2"

elevon-config.workspace = true
elevon-http.workspace = true
anyhow.workspace = true
axum.workspace = true
dotenvy.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
  "ansi",
  "env-filter",
  "json",
] }
uuid.workspace = true
serde.workspace = true
