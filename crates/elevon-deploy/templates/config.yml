name: project-name
image: project/project-name

# Number of previous releases to keep for rollback (defaults to 5 if unset).
# keep_releases: 5

# Config values below can be read from environment variables marked with $VALUE_NAME:
# - elevon.agent.url
# - elevon.agent.key
# - registry.username
# - registry.password
# - routing.port
# - routing.tls.cert
# - routing.tls.key

elevon:
  agent:
    url: $AGENT_URL
    key: $AGENT_KEY

registry:
  # server: registry-server-url  # Defaults to `ghcr.io`
  username: $GHCR_USERNAME
  password: $GHCR_PASSWORD

routing:
  domain: app.example.com
  port: 3000
  tls:
    cert: $TLS_CERT
    key: $TLS_KEY
  # static:
  #   dir: dist
  #   index: root.html  # defaults to `index.html`

# Directly uses the Dockerfile at specified destination.
# If it's in a custom path, you can use following:
#
# build:
#   path: ./dev
#   dockerfile: ./Dockerfile.dev
#
build: ../

# Environment variables that will be available to the container at runtime.
# vars: Can be hard-coded values or values read from environment variables with a name change.
# inherit: Will be inherited directly from environment variables and used with the same name.
env:
  vars:
    PORT: 3000
    API_URL: $BASE_API_URL
  inherit:
    - DATABASE_URL

# (Optional) By default, a single app named "web" will be created and routed to the configured domain.
# You can define multiple apps that share the same container image.
# Use the `worker` role to bypass domain routing and run as a standard background container.
#
# apps:
#   api:
#     role: web
#     healthcheck:
#       start_period: 5  # Seconds after start during which failed checks don't count as retries
#       interval: 5  # The number of seconds between container health checks during deployments
#       timeout: 30  # The number of seconds the deployment waits for a container to respond to the health check
#       retries: 3
#       stabilization: 5  # The number of seconds deployment waits until the container is considered as healthy
#       required_successes: 1
#       path: /health  # HTTP endpoint to send the request to for additional health check
#   worker:
#     role: worker
#     cmd: "deno run worker.ts"
#     runtime:
#       restart: unless-stopped
#       cpu: 2
#       memory: 512mb
#       network: my-network
