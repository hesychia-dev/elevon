[workspace]
resolver = "3"
members = [
  "crates/elevon-agent",
  "crates/elevon-cli",
  "crates/elevon-config",
  "crates/elevon-contracts",
  "crates/elevon-deploy",
  "crates/elevon-fs",
  "crates/elevon-http",
  "crates/elevon-server",
]

[workspace.dependencies]
elevon-config = { path = "./crates/elevon-config" }
elevon-contracts = { path = "./crates/elevon-contracts" }
elevon-deploy = { path = "./crates/elevon-deploy" }
elevon-fs = { path = "./crates/elevon-fs" }
elevon-http = { path = "./crates/elevon-http" }

async-trait = "0.1.92"
anyhow = "1"
arc-swap = "1.9.3"
axum = "0.8.9"
bollard = "0.21.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["color", "derive"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
jiff = { version = "0.2.38", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strum = "0.28.0"
strum_macros = "0.28.0"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.20"
toasty = { version = "0.11.0", default-features = false, features = [
  "jiff",
  "turso",
] }
toasty-cli = "0.11.0"
toasty-driver-turso = "0.11.0"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7"] }
