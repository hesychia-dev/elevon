name: Release Cli

on:
  push:
    tags: ["elevon-cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string

env:
  CRATE_NAME: elevon-cli
  BINARY_NAME: elevon

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-crate
        id: build
        with:
          name: ${{ env.CRATE_NAME }}
          binary: ${{ env.BINARY_NAME }}
          version: ${{ inputs.version }}
          target: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CRATE_NAME }}-${{ matrix.target }}
          path: ${{ steps.build.outputs.archive }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.CRATE_NAME }}-*
          merge-multiple: true
          path: dist

      - uses: ./.github/actions/release-crate
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('elevon-cli-v{0}', inputs.version) || github.ref_name }}
          files: dist/*.tar.gz
